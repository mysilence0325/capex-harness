# 控制面高可用：入口 nginx 的**完整可运行**配置（演练用的就是这一份）。
#
# 两个网关各自在本机 8090 上服务同一套部署，共用同一份状态（`bin/mt.sh ha-sync` 从主网关
# 单向同步）。这台 nginx 是唯一入口：健康的主网关不答话时它自动转给备用网关，`fail_timeout`
# 到期后再切回来。节点代理也指到这里（`MT_CONTROL_PLANE=https://<本机>/ai/harness`），
# 所以切换后它跟着走 —— 注册路径就在同一段 location 之下，不需要额外配置。
#
# 用现有 server 块（你们内网那台）时只取 `upstream` / `map` / `location` 三段，别整体覆盖。

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 512; }

http {
  access_log off;
  # 上游是自签证书：这里只做转发，不校验（要校验就配 proxy_ssl_trusted_certificate）。
  proxy_ssl_verify off;

  map $http_upgrade $dsh_connection_upgrade {
    default upgrade;
    ''      "";          # 空值，让 upstream keepalive 生效（不要写 close）
  }

  upstream dsh_control {
    # 主网关：2 次失败、5 秒冷却，之后 nginx 把它标记为不可用。
    server 192.168.122.137:8090 max_fails=2 fail_timeout=5s;
    # 备用网关：另一台机器上的同一套部署（MT_CONTROL_PLANE_STANDBY=1）。
    server 192.168.122.139:8090 backup;
    keepalive 16;
  }

  server {
    listen 18443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    location = /ai/harness { return 301 /ai/harness/; }

    location ^~ /ai/harness/ {
      proxy_pass https://dsh_control;
      proxy_http_version 1.1;
      proxy_set_header Host              $http_host;   # 必须带端口：控制台的同源校验比对 Origin
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;        # TLS 在这一层终止
      proxy_set_header Upgrade           $http_upgrade;  # DSH 的会话流是 WebSocket
      proxy_set_header Connection        $dsh_connection_upgrade;

      proxy_buffering         off;          # 流式输出不要缓冲
      proxy_request_buffering off;
      proxy_read_timeout      3600s;
      proxy_send_timeout      3600s;
      client_max_body_size    2048m;

      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
